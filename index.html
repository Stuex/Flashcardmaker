<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}

input{background:#000;color:#fff;border:1.5px solid #444;border-radius:10px;padding:10px;font:inherit;width:100%;margin-top:6px}input:focus{border-color:#fff;outline:0}

.rw:hover,.rw:focus-visible{border-color:#fff;outline:0}.rw b{flex:none;width:28px}.rw span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tp{position:fixed;z-index:80;background:#000;border:1px solid #fff;border-radius:10px;padding:8px 12px;max-width:260px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .15s}
#tr{position:fixed;z-index:90;width:min(320px,92vw);background:#000;border:1.5px solid #fff;border-radius:16px;padding:14px 16px 4px;animation:pop .25s}

#ts{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 9dvh);transform:translate(-50%,30px);opacity:0;pointer-events:none;background:#fff;color:#000;border-radius:14px;padding:10px 16px;display:flex;gap:14px;align-items:center;z-index:70;transition:.3s;max-width:92vw}
#ts.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}#ts button{border:0;background:#000;color:#fff;border-radius:8px;padding:5px 12px;font:inherit;cursor:pointer}
